name: Refresh connector research

on:
  schedule:
    # Mondays at 13:00 UTC
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-connector-research
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install document converter
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libreoffice-writer fonts-noto-color-emoji

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: Run connector research pipeline
        run: python scripts/build_connector_research.py

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with refreshed research
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: refresh connector research data"
          branch: automation/refresh-connector-research
          delete-branch: true
          title: "Weekly connector research refresh"
          body: |
            Automated refresh of Power Platform US Government connector research.

            This pull request was generated by the `Refresh connector research` workflow.
            It re-scrapes the Microsoft Learn connector reference pages, regenerates
            `data/connectors.json`, `data/change-log.json`, connector logos, and the
            downloadable PDF/DOCX/PPTX artifacts.

            Review the diff (especially `data/change-log.json`) before merging so the
            published site and documents only reflect verified changes.
          labels: |
            automated
            connector-research
          add-paths: |
            data/
            assets/logos/
            assets/product-icons/
            assets/documents/
